name: 4-Hour Real Estate Auto Update

on:
  schedule:
    # 4시간마다 자동 실행 (UTC 기준 0, 4, 8, 12, 16, 20시)
    - cron: '0 */4 * * *'
  workflow_dispatch: # GitHub 웹에서 [Run workflow] 버튼으로 즉시 수동 실행 가능

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  crawl-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run crawler pipeline
        run: |
          python main.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html pyeongtaek_dashboard.html data/history.json data/latest_articles.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update real estate data [skip ci]" && git push)
