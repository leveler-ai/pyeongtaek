name: Real Estate Auto Update (Manual Dispatch Only)

on:
  workflow_dispatch: # GitHub 웹에서 필요 시 수동 실행 가능 (네이버 부동산의 해외 클라우드 IP 차단으로 인해 1시간 자동 크롤링은 국내 로컬 PC 스케줄러가 전담)

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  crawl-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run crawler pipeline
        run: |
          python main.py
          cp pyeongtaek_dashboard.html index.html

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html pyeongtaek_dashboard.html data/history.json data/latest_articles.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update real estate data [skip ci]" && git push)
