name: Real Estate Auto Update (KST 08:00-22:00 Hourly)

on:
  schedule:
    # 한국 시간(KST) 오전 8시 ~ 오후 10시까지 1시간마다 자동 실행
    # (KST = UTC+9 이므로 UTC 기준 23:00, 00:00~13:00 매시 정각)
    # 오후 10시 이후 야간 및 새벽(KST 23:00 ~ 07:00)은 실행 안 함
    - cron: '0 23,0-13 * * *'
  workflow_dispatch: # GitHub 웹에서 [Run workflow] 버튼으로 즉시 수동 실행 가능

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  crawl-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run crawler pipeline
        run: |
          python main.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html pyeongtaek_dashboard.html data/history.json data/latest_articles.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update real estate data [skip ci]" && git push)
